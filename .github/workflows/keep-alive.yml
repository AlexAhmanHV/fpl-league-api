name: Keep Render service awake

on:
  schedule:
    # Every 10 minutes — Render's free tier spins a web service down after
    # ~15 minutes of inactivity, so this keeps it warm around the clock.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          if [ -z "${{ vars.RENDER_URL }}" ]; then
            echo "RENDER_URL repository variable is not set — skipping ping."
            echo "Set it under Settings > Secrets and variables > Actions > Variables"
            echo "to your Render service URL, e.g. https://fpl-league-api.onrender.com"
            exit 0
          fi
          curl -sf "${{ vars.RENDER_URL }}/health" || exit 1
